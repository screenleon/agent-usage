name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pin update: `git ls-remote --tags <repo> 'refs/tags/vN*'` and replace
      # the 40-char SHA. Keep the reviewed tag in the trailing comment.
      # Never point these steps at a moving tag or branch.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build
        run: make build
